<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Live on Twitch</title>
    <style>
        .twitch-page-container {
            padding: 1em;
        }
        .twitch-page-header {
            display: flex;
            align-items: center;
            margin-bottom: 1em;
        }
        .twitch-page-header h2 {
            margin: 0;
            font-size: 1.5em;
        }
        .twitch-live-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1em;
        }
        .twitch-live-card {
            background: var(--card-bg, rgba(0,0,0,0.3));
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .twitch-live-card:hover {
            transform: scale(1.03);
        }
        .twitch-live-card .thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #333;
            object-fit: cover;
        }
        .twitch-live-card .info {
            padding: 0.5em 0.75em;
        }
        .twitch-live-card .streamer {
            font-weight: 600;
            font-size: 0.95em;
        }
        .twitch-live-card .title {
            font-size: 0.85em;
            opacity: 0.85;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .twitch-live-card .game {
            font-size: 0.8em;
            opacity: 0.65;
            margin-top: 0.25em;
        }
        .twitch-empty {
            text-align: center;
            padding: 3em;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="twitch-page-container">
        <div class="twitch-page-header">
            <h2>Live on Twitch</h2>
        </div>
        <div id="twitchLiveGrid" class="twitch-live-grid">
            <div class="twitch-empty">Loading live streams...</div>
        </div>
    </div>
    <script>
        (function () {
            var grid = document.getElementById('twitchLiveGrid');

            // Read a field regardless of the casing convention the server used.
            // Jellyfin serialises plugin responses with a PascalCase policy, while the
            // JellyTTV backend emits snake_case, so accept every plausible spelling
            // rather than silently rendering an empty page.
            function field(obj, snake) {
                if (!obj) return undefined;
                if (obj[snake] !== undefined) return obj[snake];
                var camel = snake.replace(/_([a-z])/g, function (_, ch) { return ch.toUpperCase(); });
                if (obj[camel] !== undefined) return obj[camel];
                var pascal = camel.charAt(0).toUpperCase() + camel.slice(1);
                return obj[pascal];
            }

            function setEmpty(message) {
                grid.textContent = '';
                var div = document.createElement('div');
                div.className = 'twitch-empty';
                div.textContent = message;
                grid.appendChild(div);
            }

            function buildCard(c) {
                var login = field(c, 'login') || '';
                var name = field(c, 'display_name') || login;
                var thumb = field(c, 'thumbnail_url') || field(c, 'avatar_url') || '';
                var avatar = field(c, 'avatar_url') || '';

                var card = document.createElement('div');
                card.className = 'twitch-live-card';
                card.addEventListener('click', function () {
                    window.open('https://twitch.tv/' + login, '_blank', 'noopener');
                });

                var img = document.createElement('img');
                img.className = 'thumb';
                img.alt = name;
                img.loading = 'lazy';
                if (thumb) {
                    img.src = thumb;
                }
                if (avatar && avatar !== thumb) {
                    img.addEventListener('error', function () {
                        img.onerror = null;
                        img.src = avatar;
                    });
                }
                card.appendChild(img);

                var info = document.createElement('div');
                info.className = 'info';
                // textContent keeps stream titles safe without hand-rolled escaping.
                info.appendChild(el('div', 'streamer', name));
                info.appendChild(el('div', 'title', field(c, 'title') || ''));
                info.appendChild(el('div', 'game', field(c, 'game_name') || ''));
                card.appendChild(info);

                return card;
            }

            function el(tag, className, text) {
                var node = document.createElement(tag);
                node.className = className;
                node.textContent = text;
                return node;
            }

            function loadLive() {
                fetch('/JellyTTV/Live', { headers: { 'Accept': 'application/json' } })
                    .then(function (res) {
                        return res.text().then(function (body) {
                            if (!res.ok) {
                                var detail = '';
                                try {
                                    detail = (JSON.parse(body) || {}).error || '';
                                } catch (e) { /* not json */ }
                                throw new Error(detail || ('Live endpoint returned HTTP ' + res.status));
                            }
                            return JSON.parse(body);
                        });
                    })
                    .then(function (data) {
                        var channels = field(data, 'channels');
                        if (!Array.isArray(channels)) {
                            throw new Error('Unexpected response shape from /JellyTTV/Live');
                        }
                        if (channels.length === 0) {
                            setEmpty('No streamers are currently live.');
                            return;
                        }

                        var frag = document.createDocumentFragment();
                        channels.forEach(function (c) { frag.appendChild(buildCard(c)); });
                        grid.textContent = '';
                        grid.appendChild(frag);
                    })
                    .catch(function (err) {
                        setEmpty('Failed to load live streams: ' + (err.message || 'unknown error'));
                    });
            }

            loadLive();
            setInterval(loadLive, 60000);
        })();
    </script>
</body>
</html>
