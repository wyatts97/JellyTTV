name: Build and Release Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build plugin
        run: |
          cd jellyfin-plugin-jellyttv
          dotnet publish -c Release -o bin/publish

      - name: Create zip
        run: |
          cd jellyfin-plugin-jellyttv/bin/publish
          zip -r "../../../jellyttv-${{ steps.tag.outputs.tag }}.zip" .

      - name: Compute checksum
        id: checksum
        run: |
          checksum=$(md5sum jellyttv-${{ steps.tag.outputs.tag }}.zip | awk '{print $1}')
          echo "checksum=$checksum" >> $GITHUB_OUTPUT

      - name: Update manifest
        run: |
          python3 -c "
          import json
          with open('jellyfin-plugin-jellyttv/manifest.json', 'r') as f:
              manifest = json.load(f)
          manifest[0]['versions'][0]['checksum'] = '${{ steps.checksum.outputs.checksum }}'
          manifest[0]['versions'][0]['sourceUrl'] = 'https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/jellyttv-${{ steps.tag.outputs.tag }}.zip'
          manifest[0]['versions'][0]['timestamp'] = '$(date -u +%Y-%m-%dT%H:%M:%SZ)'
          with open('jellyfin-plugin-jellyttv/manifest.json', 'w') as f:
              json.dump(manifest, f, indent=4)
          "

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jellyfin-plugin-jellyttv/manifest.json
          git commit -m "Update manifest for ${{ steps.tag.outputs.tag }}" || echo "No changes"
          git push

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            jellyttv-${{ steps.tag.outputs.tag }}.zip
            jellyfin-plugin-jellyttv/manifest.json
          generate_release_notes: true
