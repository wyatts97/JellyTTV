name: jellyttv

x-common-env: &common-env
  JELLYTTV_CONFIG_DIR: /config
  JELLYTTV_MEDIA_ROOT: /media/twitch
  JELLYTTV_REDIS_URL: redis://redis:6379/0
  JELLYTTV_SESSION_SECRET: ${JELLYTTV_SESSION_SECRET:?set JELLYTTV_SESSION_SECRET in .env}
  JELLYTTV_PUBLIC_BASE_URL: ${JELLYTTV_PUBLIC_BASE_URL:-}
  JELLYTTV_LOG_LEVEL: ${JELLYTTV_LOG_LEVEL:-INFO}
  JELLYTTV_LOG_FORMAT: ${JELLYTTV_LOG_FORMAT:-console}
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-UTC}

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: jellyttv:local
    container_name: jellyttv-api
    restart: unless-stopped
    command: ["api"]
    environment: *common-env
    ports:
      - "${JELLYTTV_PORT:-8730}:8730"
    volumes:
      - ${CONFIG_ROOT:-./data/config}:/config
      - ${MEDIA_ROOT:-./data/media}:/media/twitch
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: jellyttv:local
    container_name: jellyttv-worker
    restart: unless-stopped
    command: ["worker"]
    environment: *common-env
    volumes:
      - ${CONFIG_ROOT:-./data/config}:/config
      - ${MEDIA_ROOT:-./data/media}:/media/twitch
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: jellyttv-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Optional: auto-HTTPS reverse proxy so Twitch EventSub webhooks can reach us.
  #   docker compose --profile with-caddy up -d
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: jellyttv-caddy
    restart: unless-stopped
    profiles: ["with-caddy"]
    environment:
      JELLYTTV_DOMAIN: ${JELLYTTV_DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # Optional: all-in-one demo install that brings its own Jellyfin.
  #   docker compose --profile with-jellyfin up -d
  # ---------------------------------------------------------------------------
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyttv-jellyfin
    restart: unless-stopped
    profiles: ["with-jellyfin"]
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8096:8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${MEDIA_ROOT:-./data/media}:/media/twitch:ro
    environment:
      TZ: ${TZ:-UTC}

volumes:
  redis_data:
  caddy_data:
  caddy_config:
  jellyfin_config:
  jellyfin_cache:
